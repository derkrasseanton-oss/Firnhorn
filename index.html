<title>Firnhorn</title>

<script>window.FIRN_ONLINE = 1;
/* Online-Mehrspieler ohne Claude: Verbindung von Browser zu Browser über PeerJS (WebRTC).
   Der Erste, der einen Raumnamen wählt, wird Gastgeber und verteilt die Lage aller an alle. Geht der Gastgeber, übernimmt ein anderer. */
const NET_PREFIX = 'firnhorn-v1-';
class NetRoom {
  constructor(name) { this.name = name; this.hostId = NET_PREFIX + name; this.cbs = []; this.st = {}; this.list = []; this.conns = new Map(); this.me = null; this.isHost = false; this.left = false; this.my = null; }
  /* Lebenszeichen: alle 1,5 s melden; wer 6 s schweigt, gilt als weg */
  beat() { if (this.hb) return; this.hb = setInterval(() => { if (this.left) { clearInterval(this.hb); return; } const now = Date.now(); if (this.isHost) { for (const [k, c] of this.conns) if (now - (c.seen || now) > 6000) { try { c.close(); } catch (e) {} this.conns.delete(k); delete this.st[k]; } this.bcast(); } else if (this.hc && this.hc.open) { this.sendP(); if (now - (this.seenL || now) > 6000) { this.seenL = now; this.lost(); } } }, 1500); }
  start() { this.beat(); return new Promise((res, rej) => { let done = false; const ok = () => { if (!done) { done = true; res(this); } }, fail = e => { if (!done) { done = true; rej(e); } };
    const host = new Peer(this.hostId, { debug: 0 });
    host.on('open', id => { if (this.left) { host.destroy(); return; } this.peer = host; this.isHost = true; this.me = id; host.on('connection', c => this.accept(c)); this.bcast(); ok(); });
    host.on('error', e => { if (e && e.type === 'unavailable-id') { try { host.destroy(); } catch (x) {} this.client(ok, fail); } else if (!this.peer) fail(e); });
    host.on('disconnected', () => { if (!this.left && this.peer === host) try { host.reconnect(); } catch (x) {} });
    setTimeout(() => fail(new Error('timeout')), 15000); }); }
  client(ok, fail) { const p = new Peer({ debug: 0 }); this.isHost = false;
    p.on('open', id => { if (this.left) { p.destroy(); return; } this.peer = p; this.me = id; const c = p.connect(this.hostId); this.hc = c;
      c.on('open', () => { this.seenL = Date.now(); ok(); this.sendP(); }); c.on('data', d => { if (d && d.t === 'L' && Array.isArray(d.l)) { this.seenL = Date.now(); this.list = d.l; this.emit(); } }); c.on('close', () => this.lost()); c.on('error', () => this.lost()); });
    p.on('error', e => { if (!this.hc || !this.hc.open) fail(e); }); }
  accept(c) { c.on('open', () => { c.seen = Date.now(); this.conns.set(c.peer, c); this.bcast(); }); c.on('data', d => { c.seen = Date.now(); if (d && d.t === 'P') { this.st[c.peer] = d.s; this.bcast(); } }); const gone = () => { this.conns.delete(c.peer); delete this.st[c.peer]; this.bcast(); }; c.on('close', gone); c.on('error', gone); }
  /* Gastgeber: höchstens zwölfmal pro Sekunde allen die Liste schicken */
  bcast() { if (this.bt) return; this.bt = setTimeout(() => { this.bt = null; if (!this.isHost) return; const l = [{ peer: this.me, s: this.my }]; for (const k of this.conns.keys()) l.push({ peer: k, s: this.st[k] || null }); this.list = l; for (const c of this.conns.values()) if (c.open) try { c.send({ t: 'L', l }); } catch (e) {} this.emit(); }, 80); }
  emit() { const peers = this.list.filter(e => e && typeof e.peer === 'string').map(e => ({ peer: e.peer, by: null, isMe: e.peer === this.me, sameTab: e.peer === this.me, kind: 'viewer', guest: false, presence: e.s && typeof e.s === 'object' ? e.s : {}, updatedAt: Date.now() })); for (const cb of this.cbs) try { cb({ peers }); } catch (e) {} }
  onPeers(cb) { this.cbs.push(cb); setTimeout(() => this.emit(), 0); return () => { this.cbs = this.cbs.filter(x => x !== cb); }; }
  presence(s) { this.my = s; if (this.isHost) this.bcast(); else this.sendP(); return Promise.resolve(); }
  sendP() { if (this.hc && this.hc.open && this.my) try { this.hc.send({ t: 'P', s: this.my }); } catch (e) {} }
  /* Gastgeber verschwunden: neu verbinden, einer wird neuer Gastgeber */
  lost() { if (this.left || this.relink) return; this.relink = true; this.list = []; this.emit(); const old = this.peer; this.peer = null; this.hc = null; try { old && old.destroy(); } catch (e) {} setTimeout(() => { if (this.left) return; this.start().then(() => { this.relink = false; this.sendP(); }, () => { this.relink = false; this.lost(); }); }, 400 + Math.random() * 1600); }
  async leave() { this.left = true; clearInterval(this.hb); for (const c of this.conns.values()) try { c.close(); } catch (e) {} try { this.peer && this.peer.destroy(); } catch (e) {} }
}
/* Foyer: ohne Raum ist man allein; ein Raumname verbindet */
const NetLobby = { online: true, peers: () => [], onPeers(cb) { setTimeout(() => cb({ peers: [] }), 0); return () => {}; }, onConnection(cb) { setTimeout(() => cb(typeof Peer === 'function'), 0); return () => {}; }, presence() { return Promise.resolve(); }, join(code) { if (typeof Peer !== 'function') return Promise.reject(new Error('no peerjs')); return new NetRoom(code).start(); } };
</script>

/* Plakat der Siebziger: Himmelblau, Marine, Sonnenrot und Skipass-Gelb. Alles liegt am Rand, die Mitte gehört dem Berg. */
:root { color-scheme: light; --navy: #14233F; --navy2: #1E3358; --sky: #2B6FD6; --red: #E2342B; --sun: #FFC93C; --org: #F28A1E; --snow: #F5F8FC; --ice: #D6E6F4; --mute: #5C6B84;
  --disp: "Shrikhand", Georgia, serif; --text: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif; --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --b: clamp(52px, 13.5vmin, 66px); --f: clamp(68px, 18vmin, 88px); }
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #8FB8E0; color: var(--navy); font: 500 16px/1.3 var(--text); touch-action: none; user-select: none; -webkit-user-select: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: none; }
button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
#mi { display: flex; align-items: center; gap: 8px; background: rgba(20,35,63,.86); color: #fff; padding: 5px 10px 6px 6px; border-radius: 6px; border-left: 4px solid var(--sun); max-width: min(64vw, 330px); width: max-content; }
#mi[hidden] { display: none; }
#miA { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--sun); display: grid; place-items: center; transition: transform .12s linear; }
#miA[hidden] { display: none; }
#miA svg { width: 62%; height: 62%; fill: var(--navy); }
#mi > div { min-width: 0; line-height: 1.1; }
#miN { display: block; font: 400 16px/1.1 var(--disp); color: var(--sun); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#miO { display: block; font-weight: 700; font-size: 13.5px; }
#miT { font-style: normal; font: 700 18px/1 var(--text); font-variant-numeric: tabular-nums; margin-left: 4px; }
#miT.low { color: #FF8A80; }
#miT:empty { display: none; }
.xpb { height: 10px; background: var(--ice); border-radius: 5px; overflow: hidden; margin-top: 2px; }
.xpb i { display: block; height: 100%; background: var(--sun); border-radius: 5px; }
.xpn { display: block; color: var(--mute); font-size: 14px; margin-top: 3px; font-weight: 700; }
.mis h4 { margin: 10px 0 4px; font-size: 15px; color: var(--mute); font-weight: 700; }
.mis li button { background: var(--navy); color: #fff; padding: 7px 12px; font-weight: 700; border-radius: 5px; font-size: 16px; flex: none; }
.mis li button.stop { background: var(--ice); color: var(--navy); }
.mis li em { font-style: normal; font-weight: 700; color: var(--mute); flex: none; font-size: 14.5px; }
.mis li.got em { color: #fff; background: #2C9A5B; padding: 2px 8px; border-radius: 4px; }
.mis li.lock { opacity: .55; }
.mis li.act { background: #FFF6DC; margin: 0 -6px; padding: 2px 6px; border-radius: 6px; }
.mis .day li em.ok { color: #fff; background: #2C9A5B; padding: 2px 8px; border-radius: 4px; }
#frost { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 50% 45%, transparent 48%, rgba(226,240,255,.5) 78%, rgba(240,248,255,.92) 100%); }
#gwN { display: inline-flex; color: #fff; font-weight: 700; font-size: 14px; background: rgba(43,111,214,.82); padding: 3px 9px; border-radius: 4px; width: max-content; } #gwN:empty { display: none; }
#vig { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(214,230,244,.55) 100%); }
#fade { position: fixed; inset: 0; pointer-events: none; background: var(--snow); opacity: 0; } #fade.go { animation: fd .7s ease-out; } @keyframes fd { from { opacity: 1; } to { opacity: 0; } }
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud button { pointer-events: auto; }
#tl { position: absolute; top: calc(var(--st) + 10px); left: calc(var(--sl) + 12px); display: flex; flex-direction: column; gap: 4px; color: var(--navy); }
.tick { display: inline-flex; align-items: baseline; gap: 8px; background: var(--snow); padding: 5px 11px 5px; font-weight: 700; font-variant-numeric: tabular-nums; border-radius: 4px; box-shadow: 0 2px 0 rgba(20,35,63,.2); width: max-content; }
.tick small { font-size: 13.5px; color: var(--mute); font-weight: 500; }
#pName { display: inline-flex; gap: 7px; align-items: center; color: #fff; font-weight: 700; font-size: 15px; background: rgba(20,35,63,.78); padding: 3px 9px; border-radius: 4px; width: max-content; } #pName:has(#pN:empty) { display: none; }
#pDot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid #fff; }
#tr { position: absolute; top: calc(var(--st) + 10px); right: calc(var(--sr) + 12px); display: flex; gap: 8px; align-items: center; }
#tal { display: inline-flex; gap: 6px; align-items: center; background: var(--navy); color: var(--sun); padding: 6px 10px; border-radius: 4px; font-weight: 700; font-variant-numeric: tabular-nums; }
#tal::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--sun); box-shadow: inset 0 0 0 2px #C8921E; }
.ico { width: 42px; height: 42px; border-radius: 4px; background: var(--snow); display: grid; place-items: center; box-shadow: 0 2px 0 rgba(20,35,63,.2); color: var(--navy); }
.ico svg, .bt svg { width: 56%; height: 56%; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
#speed { position: absolute; left: calc(var(--sl) + 14px); bottom: calc(var(--sb) + 14px); color: #fff; line-height: .9; background: var(--navy); padding: 6px 12px 8px; border-radius: 6px; border-bottom: 4px solid var(--red); display: flex; align-items: baseline; gap: 6px; min-width: 128px; justify-content: center; }
#sV { font: 400 clamp(38px, 11vmin, 52px)/1 var(--disp); }
#speed small { font-weight: 700; font-size: 16px; }
#skiBtns { position: absolute; right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 14px); display: grid; grid-template-columns: var(--b) var(--f); grid-template-rows: var(--b) var(--b); gap: 10px; align-items: end; }
.bt { width: var(--b); height: var(--b); border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(20,35,63,.62); border: 2px solid rgba(255,255,255,.8); }
.bt.on { background: var(--navy); transform: scale(.93); }
#bJump { grid-column: 2; grid-row: 1 / 3; width: var(--f); height: var(--f); align-self: end; background: var(--red); border-color: #fff; font-weight: 700; }
#bBrake { grid-column: 1; grid-row: 2; }
#bPush { grid-column: 1; grid-row: 1; } #bPush.want { background: var(--sky); }
.bt span { display: block; font-weight: 700; font-size: 13px; }
body.lh #skiBtns { right: auto; left: calc(var(--sl) + 14px); grid-template-columns: var(--f) var(--b); } body.lh #bJump { grid-column: 1; } body.lh #bBrake, body.lh #bPush { grid-column: 2; } body.lh #speed { left: auto; right: calc(var(--sr) + 14px); }
